name: Copy GDrive secrets to Kampania-Chiny

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Probe MAIL_USER without leaking
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
        run: |
          python - <<'PY'
          import os
          u = (os.environ.get("MAIL_USER") or "").strip().lower()
          print("mail_set", bool(u))
          print("mail_has_hurtmatbud", "hurtmatbud" in u)
          print("mail_domain", u.split("@")[-1] if "@" in u else "")
          PY

      - name: Copy GDrive secrets to Kampania-Chiny
        env:
          GH_TOKEN: ${{ secrets.TEMP_SECRETS_ADMIN_TOKEN }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          TARGET=Bigmax1993/Kampania-Chiny
          copy_if() {
            local name="$1"
            local val="$2"
            if [ -z "${val// }" ]; then
              echo "SKIP $name (empty in this repo)"
              return 0
            fi
            printf '%s' "$val" | gh secret set "$name" -R "$TARGET"
            echo "OK $name"
          }
          copy_if GDRIVE_OAUTH_CLIENT_ID "$GDRIVE_OAUTH_CLIENT_ID"
          copy_if GDRIVE_OAUTH_CLIENT_SECRET "$GDRIVE_OAUTH_CLIENT_SECRET"
          copy_if GDRIVE_OAUTH_REFRESH_TOKEN "$GDRIVE_OAUTH_REFRESH_TOKEN"
          copy_if GDRIVE_SERVICE_ACCOUNT_JSON "$GDRIVE_SERVICE_ACCOUNT_JSON"
