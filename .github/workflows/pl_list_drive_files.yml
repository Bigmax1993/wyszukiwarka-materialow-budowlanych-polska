name: PL list Drive Excel
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID_PL }}
  GDRIVE_FOLDER_ID_PL: ${{ secrets.GDRIVE_FOLDER_ID_PL }}
  KANBUD_PROJECT_ROOT: ${{ github.workspace }}/libs
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-scraper
      - run: pip install -r requirements-drive.txt
      - name: List ALL Drive files in PL folder
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_IMPERSONATE_EMAIL: ${{ secrets.GDRIVE_IMPERSONATE_EMAIL }}
          GDRIVE_SHARED_DRIVE_ID: ${{ secrets.GDRIVE_SHARED_DRIVE_ID }}
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          ROOT = Path(".").resolve()
          sys.path[:0] = [str(ROOT), str(ROOT / "scripts"), str(ROOT / "libs")]
          import gdrive_upload_wyniki as g
          creds, oauth = g._load_credentials()
          service, _ = g._drive_service(creds)
          folder = g._resolve_upload_folder(service, os.environ["GDRIVE_FOLDER_ID"], use_oauth=oauth)
          print("FOLDER", folder)
          q = f"'{folder}' in parents and trashed = false"
          token = None
          files = []
          while True:
              res = service.files().list(
                  q=q,
                  fields="nextPageToken, files(id,name,mimeType,modifiedTime,size)",
                  pageSize=100,
                  pageToken=token,
                  corpora="allDrives",
                  **g._LIST_OPTS,
              ).execute()
              files.extend(res.get("files") or [])
              token = res.get("nextPageToken")
              if not token:
                  break
          print(f"TOTAL_FILES={len(files)}")
          for f in sorted(files, key=lambda x: x.get("name") or ""):
              print(f"{f.get('mimeType','?'):55} {f.get('size','-'):>10}  {f.get('name')}  ({f.get('modifiedTime')})")
          # also trash?
          q2 = f"'{folder}' in parents and trashed = true"
          trash = service.files().list(q=q2, fields="files(id,name,mimeType,modifiedTime)", pageSize=50, corpora="allDrives", **g._LIST_OPTS).execute().get("files") or []
          print(f"TRASHED_IN_FOLDER={len(trash)}")
          for f in trash:
              print(f"  TRASH {f.get('name')}")
          PY
