name: PL audit Excel completeness

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: pl-pipeline
  cancel-in-progress: false

env:
  SCRAPER_TIMEZONE: Europe/Warsaw
  KANBUD_PROJECT_ROOT: ${{ github.workspace }}/libs
  GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID_PL }}
  GDRIVE_FOLDER_ID_PL: ${{ secrets.GDRIVE_FOLDER_ID_PL }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-scraper
      - run: pip install -r requirements-drive.txt ijson pandas openpyxl

      - name: Download latest wyniki-pi artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          repo = os.environ["GITHUB_REPOSITORY"]
          raw = subprocess.check_output(
              ["gh", "api", f"repos/{repo}/actions/artifacts", "--paginate"],
              text=True,
          )
          # --paginate may concatenate multiple JSON arrays
          arts = []
          for chunk in raw.strip().split("\n"):
              chunk = chunk.strip()
              if not chunk:
                  continue
              data = json.loads(chunk)
              if isinstance(data, list):
                  arts.extend(data)
              elif isinstance(data, dict) and "artifacts" in data:
                  arts.extend(data["artifacts"])
          cands = [
              a for a in arts
              if (not a.get("expired")) and a.get("name") == "pl-materialy-wyniki-pi"
          ]
          if not cands:
              sys.exit("No pl-materialy-wyniki-pi artifact found")
          cands.sort(key=lambda a: a.get("created_at") or "", reverse=True)
          pick = cands[0]
          run_id = pick["workflow_run"]["id"]
          name = pick["name"]
          print(f"PICKED name={name} run={run_id} size={pick.get('size_in_bytes')}")
          Path("artifact").mkdir(exist_ok=True)
          subprocess.check_call([
              "gh", "run", "download", str(run_id),
              "-n", name,
              "-D", "artifact",
              "-R", repo,
          ])
          PY

      - name: Audit Drive Excel vs artifact cache/excel
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_IMPERSONATE_EMAIL: ${{ secrets.GDRIVE_IMPERSONATE_EMAIL }}
          GDRIVE_SHARED_DRIVE_ID: ${{ secrets.GDRIVE_SHARED_DRIVE_ID }}
        run: |
          python - <<'PY'
          import os, sys, json, tempfile
          from pathlib import Path
          import pandas as pd
          ROOT = Path('.').resolve()
          sys.path[:0] = [str(ROOT), str(ROOT/'scripts'), str(ROOT/'libs')]
          import gdrive_upload_wyniki as g
          import pl_materialy_scraper as scraper
          import logging
          logging.basicConfig(level=logging.INFO, format='%(message)s')
          logger = logging.getLogger('audit')

          def count_xlsx(path):
              xl = pd.ExcelFile(path)
              out = {}
              for s in xl.sheet_names:
                  df = pd.read_excel(path, sheet_name=s)
                  out[s] = {
                      'rows': len(df),
                      'cols': list(df.columns),
                      'with_email': int((df['E-mail'].astype(str).str.strip()!='').sum()) if 'E-mail' in df.columns else None,
                      'urls': set(df['URL'].astype(str).str.strip()) if 'URL' in df.columns else set(),
                  }
              return out

          # --- artifact ---
          art_cache = list(Path('artifact').rglob('pl_materialy_cache.json'))
          art_xlsx = list(Path('artifact').rglob('pl_materialy_kontakte.xlsx'))
          print('ARTIFACT_CACHE', [str(p) for p in art_cache])
          print('ARTIFACT_XLSX', [str(p) for p in art_xlsx])

          contacts_n = 0
          contact_urls = set()
          crawl_n = 0
          if art_cache:
              scraper.CACHE_FILE = art_cache[0]
              cache = scraper.load_cache(logger)
              contacts = cache.get('contacts') or {}
              contacts_n = len(contacts)
              contact_urls = {str(u).strip() for u in contacts.keys() if str(u).strip()}
              crawl = cache.get('website_crawl') or {}
              crawl_n = len(crawl) if isinstance(crawl, dict) else 0
              print('ARTIFACT_CONTACTS', contacts_n)
              print('ARTIFACT_WEBSITE_CRAWL', crawl_n)
              for k,v in sorted(((k,len(v)) for k,v in cache.items() if isinstance(v,dict)), key=lambda x:-x[1])[:10]:
                  print(f'  cache_section {k}={v}')
              rows_from_cache = scraper.build_all_rows_from_cache(cache)
              print('ARTIFACT_CACHE_ROWS_PIPELINE', len(rows_from_cache))
              export_all = scraper.build_export_rows(rows_from_cache, logger=logger, cache=cache, require_eligible=False)
              export_elig = scraper.build_export_rows(rows_from_cache, logger=logger, cache=cache, require_eligible=True)
              print('ARTIFACT_EXPORT_ALL', len(export_all), 'ELIGIBLE', len(export_elig))

          art_xlsx_stats = None
          art_urls = set()
          if art_xlsx:
              art_xlsx_stats = count_xlsx(art_xlsx[0])
              print('ARTIFACT_XLSX_STATS', {k:{'rows':v['rows'],'with_email':v['with_email'],'ncols':len(v['cols'])} for k,v in art_xlsx_stats.items()})
              art_urls = art_xlsx_stats.get('Kontakte', art_xlsx_stats.get('Kontakty', {})).get('urls', set())

          # --- Drive ---
          creds, oauth = g._load_credentials()
          service, _ = g._drive_service(creds)
          folder = g._resolve_upload_folder(service, os.environ['GDRIVE_FOLDER_ID'], use_oauth=oauth)
          files = []
          token=None
          while True:
              res=service.files().list(q=f"'{folder}' in parents and trashed=false", fields='nextPageToken,files(id,name,mimeType,modifiedTime,size)', pageSize=100, pageToken=token, corpora='allDrives', **g._LIST_OPTS).execute()
              files.extend(res.get('files') or [])
              token=res.get('nextPageToken')
              if not token: break
          print('DRIVE_FILES')
          for f in sorted(files, key=lambda x: x.get('name') or ''):
              print(f"  {f.get('name')} size={f.get('size')} modified={f.get('modifiedTime')} mime={f.get('mimeType')}")

          xmeta = next((f for f in files if (f.get('name') or '')=='pl_materialy_kontakte.xlsx'), None)
          cmeta = next((f for f in files if (f.get('name') or '')=='pl_materialy_cache.json'), None)

          drive_urls=set(); drive_stats=None; drive_rows=0; drive_email=0
          if xmeta:
              with tempfile.TemporaryDirectory() as td:
                  p=Path(td)/'pl_materialy_kontakte.xlsx'
                  g._download_drive_file(service, xmeta['id'], p)
                  drive_stats=count_xlsx(p)
                  print('DRIVE_XLSX_STATS', {k:{'rows':v['rows'],'with_email':v['with_email'],'ncols':len(v['cols'])} for k,v in drive_stats.items()})
                  kstat = drive_stats.get('Kontakte', drive_stats.get('Kontakty',{}))
                  print('DRIVE_XLSX_COLS_KONTAKTE', kstat.get('cols'))
                  drive_urls = kstat.get('urls', set())
                  drive_rows = kstat.get('rows', 0)
                  drive_email = kstat.get('with_email') or 0

          drive_cache_contacts=None
          if cmeta:
              print('DRIVE_CACHE_SIZE', cmeta.get('size'))
              try:
                  import ijson
                  with tempfile.TemporaryDirectory() as td:
                      cp=Path(td)/'cache.json'
                      g._download_drive_file(service, cmeta['id'], cp)
                      n=0
                      with open(cp,'rb') as f:
                          for _ in ijson.kvitems(f,'contacts'):
                              n+=1
                      drive_cache_contacts=n
                      print('DRIVE_CACHE_CONTACTS', n)
              except Exception as e:
                  print('DRIVE_CACHE_COUNT_FAIL', e)

          # --- diffs ---
          print('COMPARE')
          print('  drive_xlsx_rows', drive_rows)
          print('  drive_xlsx_with_email', drive_email)
          print('  artifact_xlsx_rows', len(art_urls))
          print('  artifact_contacts', contacts_n)
          print('  artifact_website_crawl', crawl_n)
          only_art = sorted(art_urls - drive_urls)
          only_drive = sorted(drive_urls - art_urls)
          only_contacts = sorted(contact_urls - drive_urls)
          print('  missing_on_drive_vs_artifact_xlsx', len(only_art))
          print('  extra_on_drive_vs_artifact_xlsx', len(only_drive))
          print('  contacts_missing_on_drive', len(only_contacts))
          if only_art[:10]:
              print('  SAMPLE_MISSING_VS_ART_XLSX', only_art[:10])
          if only_contacts[:10]:
              print('  SAMPLE_CONTACTS_MISSING', only_contacts[:10])

          # Excel is contact export — not full crawl dump
          print('NOTE_EXCEL_IS_CONTACT_EXPORT_NOT_FULL_CRAWL')
          print(f'NOTE_CRAWL_VS_CONTACTS crawl={crawl_n} contacts={contacts_n} drive_xlsx={drive_rows}')

          ok_contacts = len(only_contacts)==0
          ok_art = len(only_art)==0
          print('VERDICT_CONTAINS_ALL_ARTIFACT_CONTACTS', ok_contacts)
          print('VERDICT_CONTAINS_ALL_ARTIFACT_XLSX', ok_art)
          # Pass if Drive has every contact+artifact-xlsx URL; crawl>>contacts is expected
          if contacts_n and not ok_contacts:
              raise SystemExit('INCOMPLETE: Drive Excel missing artifact contacts')
          if art_urls and not ok_art:
              raise SystemExit('INCOMPLETE: Drive Excel missing artifact xlsx rows')
          if drive_rows <= 0:
              raise SystemExit('INCOMPLETE: Drive Excel empty')
          print('VERDICT_OK_ALL_KNOWN_CONTACT_SOURCES_PRESENT')
          PY
