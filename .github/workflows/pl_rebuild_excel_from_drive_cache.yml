name: PL rebuild Excel from Drive cache

# Pełna baza z pl_materialy_cache.json na Drive → jeden Excel (wszystkie kontakty).
on:
  workflow_dispatch:
    inputs:
      eligible_only:
        description: "Tylko wiersze eligible (domyslnie: WSZYSTKIE z cache)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Tylko policz / bez uploadu"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pl-pipeline
  cancel-in-progress: false

env:
  SCRAPER_TIMEZONE: Europe/Warsaw
  KANBUD_PROJECT_ROOT: ${{ github.workspace }}/libs
  GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID_PL }}
  GDRIVE_FOLDER_ID_PL: ${{ secrets.GDRIVE_FOLDER_ID_PL }}
  GDRIVE_VERSION_XLSX: "0"
  GDRIVE_APPEND_XLSX: "0"
  GDRIVE_CONSOLIDATE_ALL_XLSX: "0"

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-scraper

      - name: Install Drive deps + ijson
        run: |
          pip install -r requirements-drive.txt
          pip install ijson

      - name: Rebuild Excel from Drive cache (all contacts)
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_IMPERSONATE_EMAIL: ${{ secrets.GDRIVE_IMPERSONATE_EMAIL }}
          GDRIVE_SHARED_DRIVE_ID: ${{ secrets.GDRIVE_SHARED_DRIVE_ID }}
        run: |
          mkdir -p Wyniki
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.eligible_only }}" = "true" ]; then
            ARGS="$ARGS --eligible-only"
          fi
          python scripts/rebuild_excel_from_drive_cache.py $ARGS

      - name: Upload Wyniki artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pl-materialy-xlsx-from-cache
          path: |
            Wyniki/*.xlsx
          if-no-files-found: warn
