name: Sync wyniki Google Drive PL

# Kampania PL — sync Drive poniedzialek
# Aktywny pipeline PL na GitHub Actions
on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: "Opcjonalnie wymus artefakt (np. pl-materialy-wyniki-thu)"
        required: false
        type: string
      sync_all:
        description: "Scal wszystkie artefakty pi/fri/tue/mon/thu i wgraj na Drive (Excel+eml+cache)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 11 * * 1"
      timezone: Europe/Warsaw

permissions:
  actions: read
  contents: read

env:
  GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID_PL }}
  GDRIVE_VERSION_XLSX: "0"
  GDRIVE_APPEND_XLSX: "1"
  SCRAPER_TIMEZONE: Europe/Warsaw
  KANBUD_PROJECT_ROOT: ${{ github.workspace }}/libs

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt -r requirements-drive.txt

      - name: Resolve artifact (najnowszy pi/fri/tue/mon/thu)
        if: ${{ github.event.inputs.sync_all != 'true' }}
        id: artifact_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FORCED="${{ github.event.inputs.artifact_name }}"
          ALL=$(gh api "repos/${{ github.repository }}/actions/artifacts" \
            --paginate --jq '.artifacts[] | select(.expired==false)')
          pick_latest() {
            local name="$1"
            echo "$ALL" | jq -s --arg n "$name" \
              '[.[] | select(.name == $n)] | sort_by(.created_at) | reverse | .[0] // empty'
          }
          pick_newest_pipeline() {
            echo "$ALL" | jq -s '
              [
                .[] | select(
                  .name == "pl-materialy-wyniki-pi"
                  or .name == "pl-materialy-wyniki-fri"
                  or .name == "pl-materialy-wyniki-tue"
                  or .name == "pl-materialy-wyniki-mon"
                  or .name == "pl-materialy-wyniki-thu"
                )
              ] | sort_by(.created_at) | reverse | .[0] // empty'
          }
          PICK=""
          if [ -n "$FORCED" ]; then
            PICK=$(pick_latest "$FORCED")
          else
            PICK=$(pick_newest_pipeline)
            if [ -z "$PICK" ] || [ "$PICK" = "null" ]; then
              PICK=$(pick_latest "pl-materialy-wyniki-reminders")
            fi
          fi
          if [ -z "$PICK" ] || [ "$PICK" = "null" ]; then
            echo "artifact=" >> "$GITHUB_OUTPUT"
            echo "run-id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "artifact=$(echo "$PICK" | jq -r '.name')" >> "$GITHUB_OUTPUT"
          echo "run-id=$(echo "$PICK" | jq -r '.workflow_run.id')" >> "$GITHUB_OUTPUT"

      - name: Download pipeline artifact
        if: ${{ github.event.inputs.sync_all != 'true' && steps.artifact_run.outputs.run-id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_run.outputs.artifact }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.artifact_run.outputs.run-id }}
          path: .

      - name: Download and merge all pipeline artifacts
        if: ${{ github.event.inputs.sync_all == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _arts Wyniki wyslane
          ALL=$(gh api "repos/${{ github.repository }}/actions/artifacts" \
            --paginate --jq '.artifacts[] | select(.expired==false)')
          pick_latest() {
            local name="$1"
            echo "$ALL" | jq -s --arg n "$name" \
              '[.[] | select(.name == $n)] | sort_by(.created_at) | reverse | .[0] // empty'
          }
          download_one() {
            local name="$1"
            local run_id="$2"
            local dest="_arts/${name}-${run_id}"
            mkdir -p "$dest"
            echo "Pobieram $name z run $run_id"
            gh run download "$run_id" -R "${{ github.repository }}" -n "$name" -D "$dest"
          }
          for NAME in pl-materialy-wyniki-thu pl-materialy-wyniki-mon pl-materialy-wyniki-tue pl-materialy-wyniki-fri pl-materialy-wyniki-pi; do
            CAND=$(pick_latest "$NAME")
            if [ -n "$CAND" ] && [ "$CAND" != "null" ]; then
              download_one "$NAME" "$(echo "$CAND" | jq -r '.workflow_run.id')"
            fi
          done
          BIG_PI=$(echo "$ALL" | jq -s '
            [.[] | select(.name=="pl-materialy-wyniki-pi")] | max_by(.size_in_bytes) // empty')
          LATEST_PI=$(pick_latest "pl-materialy-wyniki-pi")
          if [ -n "$BIG_PI" ] && [ "$BIG_PI" != "null" ]; then
            BIG_ID=$(echo "$BIG_PI" | jq -r '.workflow_run.id')
            LATEST_ID=$(echo "$LATEST_PI" | jq -r '.workflow_run.id // empty')
            if [ -n "$BIG_ID" ] && [ "$BIG_ID" != "$LATEST_ID" ]; then
              download_one "pl-materialy-wyniki-pi" "$BIG_ID"
            fi
          fi
          python scripts/merge_pl_artifact_dirs.py --src _arts --wyniki Wyniki --wyslane wyslane
          echo "Scalone pliki: $(find Wyniki wyslane -type f | wc -l)"

      - name: Validate GDRIVE credentials
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
        run: |
          python -c "
          import os, json, sys
          if not (os.environ.get('GDRIVE_FOLDER_ID') or '').strip():
              print('::warning::GDRIVE_FOLDER_ID_PL nie ustawione — upload moze nie dzialac')
          refresh = (os.environ.get('GDRIVE_OAUTH_REFRESH_TOKEN') or '').strip()
          cid = (os.environ.get('GDRIVE_OAUTH_CLIENT_ID') or '').strip()
          csec = (os.environ.get('GDRIVE_OAUTH_CLIENT_SECRET') or '').strip()
          if refresh and cid and csec:
              print('OK: OAuth (upload na Moj dysk)')
              sys.exit(0)
          raw = (os.environ.get('GDRIVE_SERVICE_ACCOUNT_JSON') or '').strip()
          if not raw:
              print('BLAD: Ustaw OAuth (GDRIVE_OAUTH_*) LUB konto uslugowego + Shared Drive')
              sys.exit(1)
          if raw.startswith('AIza'):
              print('BLAD: GDRIVE_SERVICE_ACCOUNT_JSON to klucz API, nie JSON konta uslugowego')
              sys.exit(1)
          j = json.loads(raw)
          if j.get('type') != 'service_account':
              print('BLAD: niepoprawny JSON konta uslugowego')
              sys.exit(1)
          print('OK:', j.get('client_email'))
          "

      - name: Upload Wyniki to Google Drive
        env:
          GDRIVE_UPLOAD_CACHE: ${{ github.event.inputs.sync_all == 'true' && '1' || '0' }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_IMPERSONATE_EMAIL: ${{ secrets.GDRIVE_IMPERSONATE_EMAIL }}
          GDRIVE_SHARED_DRIVE_ID: ${{ secrets.GDRIVE_SHARED_DRIVE_ID }}
        run: |
          mkdir -p Wyniki wyslane 2>/dev/null || true
          python scripts/gdrive_upload_wyniki.py --campaign-dir . --campaign pl
