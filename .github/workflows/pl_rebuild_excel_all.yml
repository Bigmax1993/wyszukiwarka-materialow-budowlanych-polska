name: PL rebuild Excel all artifacts

# Scala WSZYSTKIE artefakty GitHub → JSON → Excel z walidacja i uzupelnieniem → Drive
on:
  workflow_dispatch:
    inputs:
      upload_drive:
        description: Wgraj na Google Drive po weryfikacji
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

concurrency:
  group: pl-pipeline
  cancel-in-progress: false

env:
  SCRAPER_TIMEZONE: Europe/Warsaw
  KANBUD_PROJECT_ROOT: ${{ github.workspace }}/libs
  GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID_PL }}
  GDRIVE_VERSION_XLSX: "0"
  GDRIVE_APPEND_XLSX: "0"
  GDRIVE_UPLOAD_CACHE: "1"

jobs:
  rebuild-all:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-drive.txt

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-drive.txt

      - name: Download all PL pipeline artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _arts
          gh api "repos/${{ github.repository }}/actions/artifacts" --paginate \
            --jq '.artifacts[] | select(.expired==false and (.name | startswith("pl-materialy-wyniki-"))) | {name, id, run: .workflow_run.id, size: .size_in_bytes, created_at}' \
            > /tmp/arts.ndjson
          jq -s 'unique_by(.id) | sort_by(.created_at)' /tmp/arts.ndjson > /tmp/arts.json
          COUNT=$(jq 'length' /tmp/arts.json)
          echo "Artefaktow do pobrania: $COUNT"
          jq -c '.[]' /tmp/arts.json | while read -r row; do
            NAME=$(echo "$row" | jq -r '.name')
            RUN=$(echo "$row" | jq -r '.run')
            SIZE=$(echo "$row" | jq -r '.size')
            if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
              echo "Pomijam $NAME — brak workflow_run.id"
              continue
            fi
            DEST="_arts/${NAME}-${RUN}"
            mkdir -p "$DEST"
            echo "Pobieram $NAME run=$RUN size=$SIZE"
            gh run download "$RUN" -R "${{ github.repository }}" -n "$NAME" -D "$DEST" \
              || echo "::warning::Nie pobrano $NAME z run $RUN"
          done

      - name: Rebuild Excel from all JSON + verify/fill loop
        run: |
          python scripts/rebuild_excel_from_all_artifacts.py --src _arts --wyniki Wyniki --wyslane wyslane

      - name: Upload Wyniki artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pl-materialy-wyniki-rebuild-all
          path: |
            Wyniki/
            wyslane/

      - name: Upload complete Excel to Google Drive
        if: success() && github.event.inputs.upload_drive != 'false'
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_IMPERSONATE_EMAIL: ${{ secrets.GDRIVE_IMPERSONATE_EMAIL }}
          GDRIVE_SHARED_DRIVE_ID: ${{ secrets.GDRIVE_SHARED_DRIVE_ID }}
        run: |
          python scripts/gdrive_upload_wyniki.py --campaign-dir . --campaign pl
