name: PL consolidate Excel Drive

# Ręcznie: scal WSZYSTKIE .xlsx z folderu Drive PL → jeden plik
# (append na każdym arkuszu, polskie kolumny).
on:
  workflow_dispatch:
    inputs:
      keep_old:
        description: "Zachowaj stare kopie Excel na Drive"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pl-pipeline
  cancel-in-progress: false

env:
  SCRAPER_TIMEZONE: Europe/Warsaw
  KANBUD_PROJECT_ROOT: ${{ github.workspace }}/libs
  GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID_PL }}
  GDRIVE_FOLDER_ID_PL: ${{ secrets.GDRIVE_FOLDER_ID_PL }}
  GDRIVE_VERSION_XLSX: "0"
  GDRIVE_APPEND_XLSX: "1"
  GDRIVE_CONSOLIDATE_ALL_XLSX: "1"

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-scraper

      - name: Install Google Drive dependencies
        run: pip install -r requirements-drive.txt

      - name: Consolidate all Drive Excel → one PL file
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_IMPERSONATE_EMAIL: ${{ secrets.GDRIVE_IMPERSONATE_EMAIL }}
          GDRIVE_SHARED_DRIVE_ID: ${{ secrets.GDRIVE_SHARED_DRIVE_ID }}
        run: |
          mkdir -p Wyniki
          ARGS=""
          if [ "${{ github.event.inputs.keep_old }}" = "true" ]; then
            ARGS="--keep-old-copies"
          fi
          python scripts/consolidate_drive_xlsx_pl.py $ARGS

      - name: Upload Wyniki artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pl-materialy-xlsx-consolidated
          path: Wyniki/
          if-no-files-found: warn
